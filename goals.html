<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goals — Ayla</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>body { visibility: hidden; }</style>
</head>
<body>
  <nav class="topnav">
    <div class="brand"><a href="index.html">Ayla</a></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="goals.html" class="active">Goals</a>
      <a href="recovery.html">Recovery</a>
      <a href="review.html">Daily Log</a>
      <a href="jobs.html">Job Search</a>
      <a href="applications.html">Applications</a>
      <a href="info.html">My Info</a>
      <a href="#" id="nav-signout" title="Sign out">Sign out</a>
    </div>
  </nav>

  <main class="container">
    <header class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;">
      <div>
        <h1>Goals</h1>
        <p>Big rocks, broken into bite-size actions. Star ⭐ what you'll do this week; flag 🏁 the milestones.</p>
      </div>
      <button id="btn-add-goal" class="btn btn-gold">+ Add Goal</button>
    </header>

    <section class="filters">
      <div class="form-group">
        <label for="filter-area">Area</label>
        <select id="filter-area">
          <option value="all">All areas</option>
          <option value="career">Career</option>
          <option value="skills">Skills</option>
          <option value="health">Health</option>
          <option value="money">Money</option>
          <option value="adventure">Adventure</option>
          <option value="other">Other</option>
        </select>
      </div>
      <label class="applied-check" style="align-self:flex-end;margin-bottom:10px;">
        <input type="checkbox" id="show-inactive"> Show parked &amp; done
      </label>
    </section>

    <div id="goal-status" class="loader">Loading goals</div>
    <div id="goal-list"></div>
  </main>

  <!-- Add/Edit goal modal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal">
      <h2 id="goal-modal-title">Add Goal</h2>
      <form id="goal-form">
        <input type="hidden" id="goal-id" />
        <div class="form-row">
          <div class="form-group">
            <label for="goal-area">Area</label>
            <select id="goal-area">
              <option value="career">Career</option>
              <option value="skills">Skills</option>
              <option value="health">Health</option>
              <option value="money">Money</option>
              <option value="adventure">Adventure</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="goal-target">Target date (optional)</label>
            <input id="goal-target" type="date" />
          </div>
        </div>
        <div class="form-group">
          <label for="goal-title">Goal</label>
          <input id="goal-title" type="text" required placeholder="e.g. Return to easy trail hiking" />
        </div>
        <div class="form-group">
          <label for="goal-detail">Notes / definition of done (optional)</label>
          <textarea id="goal-detail" rows="2" placeholder="What does 'done' look like?"></textarea>
        </div>
        <div class="form-group">
          <label for="goal-status">Status</label>
          <select id="goal-status">
            <option value="active">Active</option>
            <option value="parked">Parked</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" id="btn-cancel-goal" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    Built for Ayla &middot; <a href="index.html">Home</a> &middot; <a href="review.html">Daily Log</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/goals.js"></script>
</body>
</html>
