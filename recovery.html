<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recovery — Ayla</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>body { visibility: hidden; }</style>
</head>
<body>
  <nav class="topnav">
    <div class="brand"><a href="index.html">Ayla</a></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="recovery.html" class="active">Recovery</a>
      <a href="review.html">Daily Log</a>
      <a href="jobs.html">Job Search</a>
      <a href="applications.html">Applications</a>
      <a href="info.html">My Info</a>
      <a href="#" id="nav-signout" title="Sign out">Sign out</a>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1>🌸 Recovery</h1>
      <p>One step at a time, back to running and the mountains.</p>
    </header>

    <section class="card garden-card">
      <svg id="garden" viewBox="0 0 900 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <g id="scenery"></g>
        <g id="seeds"></g>
        <g id="plants"></g>
        <g id="butterflies"></g>
      </svg>
    </section>

    <section class="card">
      <div class="card-header">
        <div class="card-title">Web of achievements <span id="tally" style="font-size:12px;color:var(--muted);font-weight:400;"></span></div>
        <button id="therapy" class="btn btn-gold btn-sm" title="Therapy session" style="font-size:16px;line-height:1;padding:6px 10px;">🧠</button>
      </div>
      <div id="web-status" class="loader">Loading</div>
      <div id="web" class="web"></div>
    </section>
  </main>

  <div id="therapy-modal" class="modal-backdrop">
    <div class="modal">
      <h2>🧠 Therapy session</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">One positive thing from today's session — it becomes a little critter in your garden.</p>
      <form id="therapy-form">
        <div class="form-group"><textarea id="therapy-note" rows="3" placeholder="A small win, a kind moment, something that felt good…" required></textarea></div>
        <div class="form-group">
          <label style="display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;">Pick your critter</label>
          <div id="critter-picker" class="critter-picker"></div>
        </div>
        <div class="modal-actions">
          <button type="button" id="therapy-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </div>
  <div id="tip"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/recovery.js"></script>
</body>
</html>
