<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Info — ACWebsite</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>body { visibility: hidden; }</style>
</head>
<body>
  <nav class="topnav">
    <div class="brand">ACWebsite</div>
    <div class="nav-links">
      <a href="index.html">Job Search</a>
      <a href="applications.html">My Applications</a>
      <a href="info.html" class="active">My Info</a>
      <a href="#" id="nav-signout" title="Sign out">Sign out</a>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1>My Info</h1>
    </header>

    <section class="profile-hero">
      <div class="profile-pic-wrap">
        <img id="profile-pic" class="profile-pic" alt="Profile" style="display:none;" />
        <div id="profile-pic-placeholder" class="profile-pic-placeholder">AC</div>
        <label for="pic-upload" class="profile-pic-edit" title="Change photo" aria-label="Change photo">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </label>
        <input id="pic-upload" type="file" accept="image/*" style="display:none;" />
      </div>
      <div class="profile-info">
        <h2 id="profile-name">Ayla Crosby</h2>
        <div class="role" id="profile-tagline">Environmental data + sustainability</div>
        <div class="links" id="profile-links">
          <a href="https://www.linkedin.com/in/ayla-crosby-3415023a5" target="_blank" rel="noopener">LinkedIn ↗</a>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Resumes</div>
        </div>
        <label for="resume-upload" class="btn btn-gold btn-sm" style="cursor:pointer;">+ Upload Resume</label>
        <input id="resume-upload" type="file" accept=".pdf,.doc,.docx" style="display:none;" multiple />
      </div>
      <div id="resume-status" class="loader">Loading resumes</div>
      <div id="resume-list" class="file-list"></div>
    </section>

    <section class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Quick Links</div>
        </div>
        <button id="btn-add-link" class="btn btn-ghost btn-sm">+ Add Link</button>
      </div>
      <div id="link-list" class="file-list"></div>
    </section>

    <section class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Cover Letters</div>
        </div>
        <label for="cover-upload" class="btn btn-gold btn-sm" style="cursor:pointer;">+ Upload Cover Letter</label>
        <input id="cover-upload" type="file" accept=".pdf,.doc,.docx" style="display:none;" multiple />
      </div>
      <div id="cover-status" class="loader">Loading cover letters</div>
      <div id="cover-list" class="file-list"></div>
    </section>
  </main>

  <!-- Add link modal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal">
      <h2>Add Quick Link</h2>
      <form id="link-form">
        <div class="form-group">
          <label for="link-label">Label</label>
          <input id="link-label" type="text" required placeholder="Portfolio, GitHub, etc." />
        </div>
        <div class="form-group">
          <label for="link-url">URL</label>
          <input id="link-url" type="text" required placeholder="linkedin.com/in/you (https:// will be added)" />
        </div>
        <div class="modal-actions">
          <button type="button" id="btn-cancel-link" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    Built for Ayla &middot; <a href="index.html">Job Search</a> &middot; <a href="applications.html">My Applications</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/richtext.js"></script>
  <script src="js/info.js"></script>
</body>
</html>
