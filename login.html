<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ACWebsite</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      padding: 20px;
    }
    .login-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lift);
      text-align: center;
    }
    .login-card .brand-big {
      font-family: Georgia, serif;
      font-size: 26px;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .login-card .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .login-card form { text-align: left; }
    .login-card .form-group { margin-bottom: 18px; }
    .login-card button { width: 100%; padding: 12px; font-size: 15px; }
    .login-msg {
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .login-msg.success { background: #d1fae5; color: #065f46; display: block; }
    .login-msg.error { background: #fee2e2; color: #991b1b; display: block; }
    .login-msg.info { background: #fef3c7; color: #92400e; display: block; }
  </style>
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <div class="brand-big">ACWebsite</div>
      <div class="subtitle">Sign in to continue.</div>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" required autocomplete="current-password" placeholder="Your password" />
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
      </form>
      <div style="font-size:12px;color:var(--muted);margin-top:8px;">This device will stay signed in.</div>
      <div style="border-top:1px solid var(--border, #eee);margin:14px 0 10px;"></div>
      <button type="button" class="btn btn-ghost btn-sm" id="magic-btn" style="width:100%;">Email me a one-time link instead</button>
      <div id="login-msg" class="login-msg"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      // If already signed in, bounce to the home page.
      let tries = 0;
      while (!window.sb && tries < 50) { await new Promise(r => setTimeout(r, 20)); tries++; }
      const session = await window.acAuth.getSession();
      if (session) window.location.replace("index.html");

      // Pre-fill the owner email for convenience.
      const owner = window.AC_CONFIG && window.AC_CONFIG.OWNER_EMAIL;
      if (owner) document.getElementById("login-email").value = owner;
    })();

    const form = document.getElementById("login-form");
    const btn = document.getElementById("login-btn");
    const magicBtn = document.getElementById("magic-btn");
    const msg = document.getElementById("login-msg");
    function showMsg(kind, text) {
      msg.className = "login-msg " + kind;
      msg.textContent = text;
    }

    // Primary: email + password sign-in (no email rate limits).
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      btn.disabled = true;
      btn.textContent = "Signing in…";
      msg.className = "login-msg";
      msg.textContent = "";
      try {
        await window.acAuth.signInWithPassword(email, password);
        window.location.replace("index.html");
      } catch (err) {
        showMsg("error", err.message || "Sign-in failed.");
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });

    // Fallback: magic link (use if the password is forgotten).
    magicBtn.addEventListener("click", async () => {
      const email = document.getElementById("login-email").value;
      magicBtn.disabled = true;
      magicBtn.textContent = "Sending…";
      msg.className = "login-msg";
      msg.textContent = "";
      try {
        await window.acAuth.signInMagicLink(email);
        showMsg("success", "Check my email for the one-time link. Click it to sign in. (Look in spam if it's not there.)");
      } catch (err) {
        showMsg("error", err.message || "Couldn't send link.");
      } finally {
        magicBtn.disabled = false;
        magicBtn.textContent = "Email me a one-time link instead";
      }
    });
  </script>
</body>
</html>
