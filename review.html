<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Review — Ayla</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>body { visibility: hidden; }</style>
</head>
<body>
  <nav class="topnav">
    <div class="brand"><a href="index.html">Ayla</a></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="goals.html">Goals</a>
      <a href="recovery.html">Recovery</a>
      <a href="review.html" class="active">Weekly Review</a>
      <a href="cities.html">Where to Live</a>

      <a href="info.html">My Info</a>
      <a href="#" id="nav-signout" title="Sign out">Sign out</a>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1>Weekly Review</h1>
      <p>Five minutes once a week: what moved, what's stuck, the 3 things for next week.</p>
    </header>

    <section class="card">
      <div class="card-header">
        <div class="card-title" id="review-week-label">This week</div>
      </div>
      <form id="review-form">
        <input type="hidden" id="review-id" />
        <div class="form-group">
          <label for="review-week">Week of</label>
          <input id="review-week" type="date" />
        </div>
        <div class="form-group">
          <label for="review-wins">✅ Wins — what moved forward</label>
          <textarea id="review-wins" rows="3" placeholder="Even small ones count, especially in recovery."></textarea>
        </div>
        <div class="form-group">
          <label for="review-stuck">⚠️ Stuck — what's blocked or draining</label>
          <textarea id="review-stuck" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="review-top3">🎯 Top 3 for next week</label>
          <textarea id="review-top3" rows="3" placeholder="1.&#10;2.&#10;3."></textarea>
        </div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button type="submit" class="btn btn-primary">Save review</button>
          <span id="review-saved" style="color:var(--muted);font-size:13px;align-self:center;"></span>
        </div>
      </form>
    </section>

    <h2 style="font-family:Georgia,serif;color:var(--navy);font-size:20px;margin:28px 0 12px;">Past reviews</h2>
    <div id="review-status" class="loader">Loading</div>
    <div id="review-history"></div>
  </main>

  <footer>
    Built for Ayla &middot; <a href="index.html">Home</a> &middot; <a href="goals.html">Goals</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
