<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Log — Ayla</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>body { visibility: hidden; }</style>
</head>
<body>
  <nav class="topnav">
    <div class="brand"><a href="index.html" aria-label="Home"><img id="brand-pic" class="brand-pic" alt="Home" style="display:none;" /><span id="brand-fallback">Ayla</span></a></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="review.html" class="active">Daily Log</a>
      <a href="recovery.html">Recovery</a>
      <a href="jobs.html">Job Search</a>
      <a href="applications.html">Applications</a>
      <a href="info.html">My Info</a>
      <a href="#" id="nav-signout" title="Sign out">Sign out</a>
    </div>
  </nav>

  <main class="container container-narrow">
    <section class="daily-banner">
      <div class="daily-banner-garden" id="banner-garden" aria-hidden="true"></div>
      <div class="daily-banner-title">🌸 Daily Log</div>
      <div class="daily-banner-sub">A few cozy minutes at the end of the day.</div>
      <button type="button" id="btn-new-entry" class="btn btn-primary">🌸 Add today's entry</button>
      <div id="entry-form-wrap" class="daily-banner-panel" hidden>
        <div class="entry-form-day" id="log-day-label">Today</div>
        <form id="log-form">
          <input type="hidden" id="log-id" />
          <div class="form-group">
            <label for="log-date">Date</label>
            <input id="log-date" type="date" />
          </div>
          <div class="form-group">
            <label for="log-wins">🌸 Three wins today</label>
            <textarea id="log-wins" rows="3" placeholder="1.&#10;2.&#10;3."></textarea>
          </div>
          <div class="form-group">
            <label for="log-forward">☀️ Looking forward to tomorrow</label>
            <textarea id="log-forward" rows="2" placeholder="One thing, big or small."></textarea>
          </div>
          <div class="form-group">
            <label for="log-hard">🐌 One thing that was hard (or slow) today</label>
            <textarea id="log-hard" rows="2" placeholder="Be honest — recovery is allowed to be hard."></textarea>
          </div>
          <div class="form-group">
            <label class="btn-pin" for="log-photo">📌 Add photos</label>
            <input id="log-photo" type="file" accept="image/*" multiple hidden />
            <div id="log-photo-current" class="photo-thumbs" style="margin-top:8px;"></div>
          </div>
          <div class="modal-actions" style="justify-content:flex-start;">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" id="btn-cancel-entry" class="btn btn-ghost">Cancel</button>
            <span id="log-saved" style="color:var(--navy-deep);font-size:13px;align-self:center;"></span>
          </div>
        </form>
      </div>
    </section>

    <h2 class="past-days-title">🌿 Past days</h2>
    <div id="log-status" class="loader">Loading</div>
    <div id="log-history"></div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-inner">
      <button type="button" class="lightbox-close" data-close aria-label="Close">×</button>
      <img id="lightbox-img" alt="photo" />
    </div>
  </div>

  <footer>
    Built for Ayla &middot; <a href="index.html">Home</a> &middot; <a href="recovery.html">Recovery</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/garden-art.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
