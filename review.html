<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Log — Ayla</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>body { visibility: hidden; }</style>
</head>
<body>
  <nav class="topnav">
    <div class="brand"><a href="index.html">Ayla</a></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="recovery.html">Recovery</a>
      <a href="review.html" class="active">Daily Log</a>
      <a href="jobs.html">Job Search</a>
      <a href="applications.html">Applications</a>
      <a href="info.html">My Info</a>
      <a href="#" id="nav-signout" title="Sign out">Sign out</a>
    </div>
  </nav>

  <main class="container container-narrow">
    <header class="page-header">
      <h1>Daily Log</h1>
      <p>A couple of minutes at the end of the day: a photo, three wins, what you're looking forward to, and one honest hard thing.</p>
    </header>

    <section class="card">
      <div class="card-header">
        <div class="card-title" id="log-day-label">Today</div>
      </div>
      <form id="log-form">
        <input type="hidden" id="log-id" />
        <div class="form-group">
          <label for="log-date">Date</label>
          <input id="log-date" type="date" />
        </div>
        <div class="form-group">
          <label for="log-photo">📷 Photos of the day <span style="color:var(--muted);font-weight:400;">(up to 3 — show on your Home collage)</span></label>
          <input id="log-photo" type="file" accept="image/*" multiple />
          <div id="log-photo-current" class="photo-thumbs" style="margin-top:8px;"></div>
        </div>
        <div class="form-group">
          <label for="log-wins">🌸 Three wins today</label>
          <textarea id="log-wins" rows="3" placeholder="1.&#10;2.&#10;3."></textarea>
        </div>
        <div class="form-group">
          <label for="log-forward">☀️ Looking forward to tomorrow</label>
          <textarea id="log-forward" rows="2" placeholder="One thing, big or small."></textarea>
        </div>
        <div class="form-group">
          <label for="log-hard">🐌 One thing that was hard (or slow) today</label>
          <textarea id="log-hard" rows="2" placeholder="Be honest — recovery is allowed to be hard."></textarea>
        </div>
        <div class="modal-actions" style="justify-content:flex-start;">
          <button type="submit" class="btn btn-primary">Save</button>
          <span id="log-saved" style="color:var(--muted);font-size:13px;align-self:center;"></span>
        </div>
      </form>
    </section>

    <h2 style="font-family:Georgia,serif;color:var(--navy);font-size:20px;margin:28px 0 12px;">Past days</h2>
    <div id="log-status" class="loader">Loading</div>
    <div id="log-history"></div>
  </main>

  <footer>
    Built for Ayla &middot; <a href="index.html">Home</a> &middot; <a href="recovery.html">Recovery</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
